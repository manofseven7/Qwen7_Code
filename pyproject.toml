[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coadaptive-privacy-compression"
version = "1.0.0"
description = "Reproducibility code for co-adaptive privacy-compression allocation"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Amir Mollanejad"}]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
